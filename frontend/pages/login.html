<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Campus Complaint System</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">Campus Complaint System</div>

        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </div>
    </nav>

    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Login to your Campus Complaint System account</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="loginType">Login As</label>

                    <select id="loginType" required>
                        <option value="">Select Role</option>
                        <option value="student">Student</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="loginId">
                        Register Number / Email / Admin ID
                    </label>

                    <input
                        type="text"
                        id="loginId"
                        placeholder="Enter your login ID"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div id="loginMessage"></div>

                <button type="submit" class="auth-btn">
                    Login
                </button>

            </form>

            <div class="auth-footer-text">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </div>

        </div>

    </main>

    <script src="../js/common.js"></script>
    <script src="../js/auth.js"></script>

</body>
</html>
