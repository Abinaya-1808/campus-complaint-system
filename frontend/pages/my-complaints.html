<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Complaints - Campus Complaint System</title>

    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/complaint.css">

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            Campus Complaint System
        </div>


        <div class="nav-links">

            <a href="../index.html">
                Home
            </a>

            <a href="student-dashboard.html">
                Dashboard
            </a>

            <a href="my-complaints.html" class="active">
                My Complaints
            </a>

            <a href="notifications.html" class="notification-nav">

                🔔 Notifications

                <span id="notificationBadge" class="notification-badge">
                    0
                </span>

            </a>

            <a href="#" id="logoutBtn">
                Logout
            </a>

        </div>

    </nav>



    <!-- MAIN CONTENT -->

    <main class="complaint-page">


        <div class="complaint-list-container">


            <!-- PAGE HEADER -->

            <div class="complaint-list-header">

                <div>

                    <p class="page-label">
                        Student Portal
                    </p>

                    <h1>
                        My Complaints
                    </h1>

                    <p>
                        View and track all the complaints you have submitted.
                    </p>

                </div>


                <a
                    href="submit-complaint.html"
                    class="submit-new-btn"
                >
                    + New Complaint
                </a>

            </div>



            <!-- COMPLAINT SUMMARY -->

            <div class="complaint-summary">


                <div>

                    <span>
                        Total
                    </span>

                    <strong id="myTotal">
                        0
                    </strong>

                </div>


                <div>

                    <span>
                        Pending
                    </span>

                    <strong id="myPending">
                        0
                    </strong>

                </div>


                <div>

                    <span>
                        In Progress
                    </span>

                    <strong id="myProgress">
                        0
                    </strong>

                </div>


                <div>

                    <span>
                        Resolved
                    </span>

                    <strong id="myResolved">
                        0
                    </strong>

                </div>


            </div>



            <!-- COMPLAINT LIST -->

                        <div id="complaintsList">
                <div class="complaint-card skeleton-card" aria-hidden="true" style="margin-bottom: 20px;">
                    <div class="complaint-card-header">
                        <div style="flex: 1; max-width: 65%;">
                            <div class="skeleton skeleton-title" style="width: 70%; height: 22px; margin-bottom: 8px;"></div>
                            <div class="skeleton skeleton-subtitle" style="width: 40%; height: 12px; margin-bottom: 0;"></div>
                        </div>
                        <div class="skeleton skeleton-badge" style="width: 88px; height: 26px;"></div>
                    </div>
                    <div class="complaint-meta" style="gap: 16px; margin: 15px 0;">
                        <div class="skeleton" style="width: 120px; height: 16px;"></div>
                        <div class="skeleton" style="width: 110px; height: 16px;"></div>
                        <div class="skeleton" style="width: 130px; height: 16px;"></div>
                        <div class="skeleton" style="width: 95px; height: 16px;"></div>
                    </div>
                    <div class="skeleton skeleton-btn" style="width: 120px; height: 38px; align-self: flex-start; margin-top: 10px;"></div>
                </div>
            </div>


        </div>


    </main>



    <!-- FOOTER -->

    <footer class="footer">

        <p>
            © 2026 Campus Complaint System. All rights reserved.
        </p>

    </footer>



    <!-- JAVASCRIPT -->

    <script src="../js/common.js"></script>

    <script src="../js/complaints.js"></script>

    <script src="../js/student.js"></script>


</body>

</html>
