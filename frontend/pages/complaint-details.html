<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Complaint Details - Campus Complaint System</title>

    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/complaint.css">

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            Campus Complaint System
        </div>


        <div class="nav-links">

            <a href="../index.html">
                Home
            </a>

            <a href="student-dashboard.html">
                Dashboard
            </a>

            <a href="my-complaints.html">
                My Complaints
            </a>

            <a href="notifications.html" class="notification-nav">

                🔔 Notifications

                <span id="notificationBadge" class="notification-badge">
                    0
                </span>

            </a>

            <a href="#" id="logoutBtn">
                Logout
            </a>

        </div>

    </nav>



    <!-- MAIN CONTENT -->

    <main class="complaint-page">


        <div class="details-container">


            <div id="detailsContent">

                <div class="empty-state">

                    <div class="skeleton-detail-wrapper" aria-hidden="true" style="width: 100%; text-align: left;">
                        <section class="details-section" style="margin-bottom: 24px;">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap;">
                                <div style="flex: 1; min-width: 250px;">
                                    <div class="skeleton skeleton-title" style="width: 60%; height: 28px; margin-bottom: 10px;"></div>
                                    <div class="skeleton skeleton-subtitle" style="width: 35%; height: 14px;"></div>
                                </div>
                                <div class="skeleton skeleton-badge" style="width: 100px; height: 32px;"></div>
                            </div>
                            <div class="details-grid" style="margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                                <div class="detail-box" style="padding: 16px;">
                                    <div class="skeleton" style="width: 60px; height: 11px; margin-bottom: 8px;"></div>
                                    <div class="skeleton" style="width: 75%; height: 18px;"></div>
                                </div>
                                <div class="detail-box" style="padding: 16px;">
                                    <div class="skeleton" style="width: 50px; height: 11px; margin-bottom: 8px;"></div>
                                    <div class="skeleton" style="width: 65%; height: 18px;"></div>
                                </div>
                                <div class="detail-box" style="padding: 16px;">
                                    <div class="skeleton" style="width: 70px; height: 11px; margin-bottom: 8px;"></div>
                                    <div class="skeleton" style="width: 80%; height: 18px;"></div>
                                </div>
                                <div class="detail-box" style="padding: 16px;">
                                    <div class="skeleton" style="width: 65px; height: 11px; margin-bottom: 8px;"></div>
                                    <div class="skeleton" style="width: 70%; height: 18px;"></div>
                                </div>
                            </div>
                        </section>
                        <section class="details-section" style="margin-bottom: 24px;">
                            <div class="skeleton" style="width: 140px; height: 20px; margin-bottom: 16px;"></div>
                            <div class="skeleton skeleton-text" style="width: 100%;"></div>
                            <div class="skeleton skeleton-text" style="width: 95%;"></div>
                            <div class="skeleton skeleton-text" style="width: 60%;"></div>
                        </section>
                    </div>

                </div>

            </div>


        </div>


    </main>



    <!-- FOOTER -->

    <footer class="footer">

        <p>
            © 2026 Campus Complaint System. All rights reserved.
        </p>

    </footer>



    <!-- JAVASCRIPT -->

    <script src="../js/common.js"></script>

    <script src="../js/complaints.js"></script>

    <script src="../js/student.js"></script>


</body>

</html>
