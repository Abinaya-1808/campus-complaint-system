<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="favGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .badge-bg {
      fill: url(#favGrad);
      stroke: #7dd3fc;
      stroke-width: 1.5;
    }
    @media (prefers-color-scheme: dark) {
      .badge-bg {
        fill: url(#favGrad);
        stroke: #38bdf8;
        stroke-width: 2;
      }
    }
  </style>
  <!-- Background Badge with Luminous Outer Border -->
  <rect class="badge-bg" x="1.5" y="1.5" width="29" height="29" rx="7.5"/>
  <!-- Graduation Cap Top -->
  <path d="M16 7 L27 12 L16 17 L5 12 Z" fill="#ffffff" filter="url(#favGlow)"/>
  <!-- Graduation Cap Underbody -->
  <path d="M9.5 14.5 V19.5 C9.5 21.3 12.5 23 16 23 C19.5 23 22.5 21.3 22.5 19.5 V14.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- Tassel & Bead -->
  <path d="M25 13.5 V18.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="25" cy="19.5" r="1.3" fill="#ffffff"/>
</svg>
